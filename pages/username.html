
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bet You Can't Spell This</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


    <main id="app">


        <!-- =================================
             Create Account
             ================================= -->

        <section class="game-screen username-screen">


            <!-- =================================
                 Title
                 ================================= -->
            <div class="divider">
                ==========================================
            </div>
            
            <header class="username-title">

                <h1>CREATE ACCOUNT</h1>

            </header>


            <div class="divider">
                ------------------------------------------
                
            </div>


            <!-- =================================
                 Username Input
                 ================================= -->

            <section class="username-form">

                <label for="username">
                    
                   ENTER USERNAME
                    
                </label>

                <input
                id="username"
                name="username"
                type="text"
                pattern="[A-Z0-9_]+"
                style="text-transform: uppercase"
                maxlength="20"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9_]/g, '')"
                required
                inputmode="text"
                >
                <p
                    id="usernameError"
                    class="username-error"
                    aria-live="polite"
                ></p>
               <p>
                [20 characters (A-Z, 0-9, _), no spaces]
                </p>
                
            </section> 


            <!-- =================================
                 Continue
                 ================================= -->

            <section class="username-actions">

                <button
                    id="continueButton"
                    type="button"
                >
                    CONTINUE
                </button>



    <p>
        ALREADY HAVE AN ACCOUNT?
    </p>


    <button
        id="recoverAccountButton"
        type="button"
    >
        RECOVER ACCOUNT
    </button>


</section>
</section>

    </main>


    <script src="../js/core/actions.js"></script>

    <script src="../js/core/api.js"></script>

    <script src="../js/features/user.js"></script>


</body>

</html>
